<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omnichannel widget playground</title>
  </head>
  <body>
    <main style="font: 16px system-ui; padding: 40px; max-width: 720px">
      <h1>Omnichannel widget playground</h1>

      <label>Username <input id="username" value="demo" /></label><br /><br />

      <button id="unmount">Destroy widget</button>

    <script type="module" src="/src/demo.ts"></script>
